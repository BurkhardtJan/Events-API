name: CI_events_API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        run: |
          docker build -t events-api:latest .

      - name: Run docker container
        run: |
          docker run -d -p 5000:5000 --name events-api-container events-api:latest

      - name: Container health check
        run: |
          sleep 5
          curl 'http://localhost:5000/api/health' || exit 1

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install pytest requests
          pip install -r requirements.txt

      - name: Run tests against container
        run: |
          pytest -v

      - name: Cleanup Docker container
        if: always()
        run: |
          docker stop events-api-container || true
          docker rm events-api-container || true    

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Tag Docker image
        run: |
          docker tag events-api:latest ${{secrets.DOCKERHUB_USERNAME}}/events-api:latest

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{secrets.DOCKERHUB_USERNAME}}/events-api:latest

      - name: Trigger render redeploy
        run: |
          curl -X POST ${{secrets.RENDER_REDEPLOY_LINK}}

      - name: Render health check
        run: |
          sleep 50
          curl '${{secrets.RENDER_BASE_URL}}/api/health' || exit 1


